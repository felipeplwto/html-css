<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        thead {
            background-color: gray;
            color: white;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
        }

        .media {
            background-color: gray;
            color: white;
            font-weight: bolder;
            text-align: center;
        }

        .num {
            text-align: center;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplina</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td class="num">10,0</td>
                <td class="num">9,0</td>
                <td class="num">9,5</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="num">7,0</td>
                <td class="num">9,0</td>
                <td class="num">8,0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="num">4,0</td>
                <td class="num">8,0</td>
                <td class="num">6,0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="num">10,0</td>
                <td class="num">7,5</td>
                <td class="num">8,75</td>
            </tr>
            <tr>
                <th class="media" colspan="4" scope="row">Média de Exatas</th>
                <td class="media">8,0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td class="num">7,0</td>
                <td class="num">8,0</td>
                <td class="num">7,5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="num">10,0</td>
                <td class="num">8,0</td>
                <td class="num">9,0</td>
            </tr>
            <tr>
                <th class="media" colspan="4" scope="row">Média de Humanas</th>
                <td class="media">8,25</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
