<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 06</title>
</head>
<body>
    <h1>TAGS</h1>
    <p>
        Em HTML5, podemos inserir os elemntos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.
    </p>
    <p>
        <ul type="square">
            <li>
                <abbr title="<h1>">Título Nível 1</abbr>
            </li>
            <li>
                <abbr title="<p>">Parágrafo</abbr>
            </li>
            <li>
                <abbr title="<ol>">Lista Ordenada</abbr>
            </li>
            <li>
                <abbr title="<ul>">Lista Não Ordenada</abbr>
            </li>
            <li>
                <abbr title="<li>">Item da Lista</abbr>
            </li>
            <li>
                <abbr title="<dl>">Lista com Definição</abbr>
            </li>
            <li>
                <abbr title="<abbr>">Abreviação</abbr>
            </li>
            <li>
                <abbr title="<img>">Imagem</abbr>
            </li>
        </ul>
    </p>
</body>
</html>
