<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required autocomplete="name" maxlength="30" placeholder="Nome Completo">
        </p>

        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" max="10" min="0" placeholder="0 a 10" step="0.5" value="5" required>
        </p>
        <p>
            <label for="iper">Período Letivo:</label>
            <input type="month" name="mes" id="imes" value="2026-02">
        </p>
        <p>
            <label for="idata">Dia da Prova:</label>
            <input type="date" name="data" id="idata" value="2026-02-27">
        </p>
        <p>
            <label for="itempo">Hora da Prova:</label>
            <input type="time" name="tempo" id="itempo" value="13:13">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
